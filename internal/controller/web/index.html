<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS Control</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>OS Control</h1>
  <div id="agent-status" class="status offline"><span class="dot"></span><span id="agent-status-text">агент офлайн</span></div>
</header>
<main>
  <section class="card">
    <h2>Цільовий сервер</h2>
    <p class="muted">WoL MAC: <span id="wol-mac">—</span></p>
    <div class="buttons">
      <button id="btn-wol">Wake on LAN</button>
      <button id="btn-shutdown" class="danger">Вимкнути сервер</button>
    </div>
    <p id="action-msg" class="muted"></p>
  </section>
  <section class="card">
    <h2>Контейнери</h2>
    <table id="containers-table">
      <thead><tr><th>Ім'я</th><th>Стан</th><th>Дії</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
  <section class="card">
    <h2>Телеметрія</h2>
    <div id="cpu-temps" class="muted">—</div>
    <div id="ram" class="muted">—</div>
    <div id="gpu" class="muted">—</div>
    <div id="load" class="muted">—</div>
  </section>
  <section class="card">
    <h2>amd-smi monitor</h2>
    <pre id="amdsmi" class="muted">—</pre>
  </section>
</main>
<footer>
  <span id="updated-at"></span>
  · API токен: <input id="token" type="password" placeholder="введіть токен" autocomplete="off">
  <button id="btn-save-token">зберегти</button>
</footer>
<script src="app.js"></script>
</body>
</html>
