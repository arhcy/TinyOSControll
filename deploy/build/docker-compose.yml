# OSControl build stage.
#
# Runs the build container: generates TLS keys, packages the Python daemons
# (build = py_compile check), generates configs and the target installer —
# everything lands in the mounted docker volume "osagent-build" (/out).
#
# Usage (on the CONTROL server, from the repo root):
#   WEB_HOSTNAME=ctrl WEB_IP=192.168.1.20 WOL_MAC=AA:BB:CC:DD:EE:FF \
#     docker compose -f deploy/build/docker-compose.yml up --build
# Optional: WOL_IP, API_TOKEN, CONTROLLER_URL, CONTAINERS, TELEMETRY_INTERVAL
name: osagent-build
services:
  build:
    build:
      context: ../..
      dockerfile: deploy/build/Dockerfile
    image: osagent-build:local
    volumes:
      - osagent-build:/out
    environment:
      WEB_HOSTNAME: ${WEB_HOSTNAME:?set WEB_HOSTNAME (panel hostname)}
      WEB_IP: ${WEB_IP:?set WEB_IP (control server IP)}
      WOL_MAC: ${WOL_MAC:?set WOL_MAC (target MAC address)}
      WOL_IP: ${WOL_IP:-}
      API_TOKEN: ${API_TOKEN:-}
      CONTROLLER_URL: ${CONTROLLER_URL:-}
      CONTAINERS: ${CONTAINERS:-}
      TELEMETRY_INTERVAL: ${TELEMETRY_INTERVAL:-1}

volumes:
  osagent-build:
    name: osagent-build
