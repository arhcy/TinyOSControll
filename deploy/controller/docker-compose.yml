# OSControl controller (CONTROL server).
#
# Runs the Python controller daemon in a container. Everything it needs
# (keys, daemons, web panel, config) is read from the "osagent-build" docker
# volume produced by the build stage — see deploy/build/docker-compose.yml.
#
# Usage (from the repo root, after the build stage ran):
#   docker compose -f deploy/controller/docker-compose.yml up -d
name: osagent-controller
services:
  controller:
    image: python:3.12-slim
    user: "10001:10001"   # matches the key ownership in the build volume
    restart: unless-stopped
    network_mode: host   # WoL broadcast must reach the LAN
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - osagent-build:/out:ro
    command: ["python3", "-B", "/out/daemons/osagent_controller.py", "--config", "/out/config/controller.json"]
    tmpfs:
      - /tmp:size=16m
