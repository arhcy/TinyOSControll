<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TinyOSControll</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>TinyOSControll</h1>
    <div id="conn" class="conn">disconnected</div>
    <div class="tokenbox">
      <label for="token">API token</label>
      <input id="token" type="password" placeholder="X-API-Key" autocomplete="off" />
      <button id="save">Save</button>
    </div>
  </header>

  <main id="agents"></main>

  <footer>
    <span id="status-line">loading&hellip;</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
